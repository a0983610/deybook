<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>daybook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="days">
    <!-- 自動補完：灰字疊在輸入框上，Tab 收下（見 開發筆記 D031、D032） -->
    <div class="ghostWrap">
      <input id="q" type="search" placeholder="搜尋（Ctrl+F）" title="空白隔開的每個詞都要出現；灰字按 Tab 帶入" autocomplete="off" spellcheck="false">
      <div class="ghost" aria-hidden="true"></div>
    </div>
    <nav id="dayList" title="Alt+← / Alt+→ 換日　Alt+Home 回今天"></nav>
    <footer id="dirBar">
      <div id="dirPath"></div>
      <button id="dirBtn" type="button">變更資料夾…</button>
    </footer>
  </aside>

  <main id="center">
    <header>
      <button id="backBtn" type="button" hidden>← 回到那天</button>
      <h1 id="dayTitle"></h1>
      <span id="saveState"></span>
      <button id="modeBtn" type="button"></button>
    </header>

    <!-- 上：這一天已處理（每日檔）；下：待處理（待辦.md，不分哪一天）（見 開發筆記 D024）
         標題列點一下就收起來／展開（見 開發筆記 D027） -->
    <section id="doneBox" class="pane">
      <button id="doneHead" class="paneHead" type="button">已處理</button>
      <div id="cards" class="cardList"></div>
      <textarea id="editor" spellcheck="false" hidden></textarea>
    </section>
    <section id="todoBox" class="pane">
      <button id="todoHead" class="paneHead" type="button">待處理</button>
      <div id="todoCards" class="cardList"></div>
      <textarea id="todo" spellcheck="false" hidden></textarea>
    </section>
    <div id="results" hidden></div>

    <form id="newForm" autocomplete="off">
      <div class="ghostWrap">
        <input id="newTitle" placeholder="標題（例：CWMM3030 備料調撥 BUG）　Enter 換到內文" spellcheck="false">
        <div class="ghost" aria-hidden="true"></div>
      </div>
      <textarea id="newBody" rows="2" placeholder="內文（Tab 可縮排）" spellcheck="false"></textarea>
      <div class="row">
        <span class="hint">Ctrl+Enter 加到待處理　Ctrl+Shift+Enter 加到已處理　灰字按 Tab 帶入</span>
        <button id="addTodo" type="submit">＋ 待處理</button>
        <button id="addDone" type="button">＋ 已處理（這一天）</button>
      </div>
    </form>
  </main>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
